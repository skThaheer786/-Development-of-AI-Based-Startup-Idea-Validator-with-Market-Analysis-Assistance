{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width: 560px;">
  <div class="display-4 fw-extrabold text-navy mb-2">{{ code }}</div>
  <h4 class="mb-3">{{ title }}</h4>
  <p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary-custom px-4">Back to the dashboard</a>
</div>
{% endblock %}
